name: Import a release

# One-off helper: copies the installers of an existing release from the source
# repository into a release here, and checks every file against its checksum.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to copy
        required: true
        default: desktop-v1.0.4

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          mkdir files && cd files
          gh release download "$TAG" --repo Thelaw247/cedar-student-pilot
          ls -la
          sha256sum -c SHA256SUMS.txt
          cat > ../notes.md <<'NOTES'
          Download the file for your computer. Most people should use the download buttons at https://praelecta.ca instead.

          - Windows: Praelecta-Setup.exe (or Praelecta-win.zip if the installer is blocked)
          - Mac: Praelecta-mac-arm64.dmg (Apple silicon) or Praelecta-mac-x64.dmg (Intel)
          - Linux: Praelecta-linux.AppImage or Praelecta-linux.deb

          SHA256SUMS.txt lists a checksum for every file.
          NOTES
          gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" --target main \
            --title "Praelecta desktop $TAG" --notes-file ../notes.md --latest
